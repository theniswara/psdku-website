<header class="sticky top-0 z-40 flex w-full bg-white drop-shadow-sm border-b border-slate-200">
    <div class="flex flex-grow items-center justify-between px-4 py-4 shadow-2 md:px-6 2xl:px-11">

        <div class="flex items-center gap-2 sm:gap-4">

            <button (click)="toggleSidebar.emit()"
                class="block lg:hidden rounded-sm border border-slate-200 bg-white p-1.5 text-slate-600 hover:text-[#FF7F11]">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <div class="hidden sm:block ml-4">
                <div class="relative">
                    <button class="absolute left-0 top-1/2 -translate-y-1/2">
                        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                    </button>
                    <input type="text" placeholder="Search dashboard..."
                        class="w-full bg-transparent pl-9 pr-4 text-sm font-medium focus:outline-none xl:w-96 placeholder-slate-400 text-slate-600" />
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 2xsm:gap-7">

            <ul class="flex items-center gap-2 2xsm:gap-4">

                <li>
                    <button
                        class="relative flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 hover:text-[#FF7F11] text-slate-500 transition-colors">
                        <i class="fa-regular fa-moon"></i>
                    </button>
                </li>

                <li class="relative">
                    <button
                        class="relative flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 hover:text-[#FF7F11] text-slate-500 transition-colors">
                        <span
                            class="absolute -top-0.5 right-0 h-2.5 w-2.5 rounded-full bg-red-500 border-2 border-white"></span>
                        <i class="fa-regular fa-bell"></i>
                    </button>
                </li>

                <li class="relative">
                    <button
                        class="relative flex h-8 w-8 items-center justify-center rounded-full bg-slate-50 hover:text-[#FF7F11] text-slate-500 transition-colors">
                        <i class="fa-regular fa-comment"></i>
                    </button>
                </li>
            </ul>

            <div class="relative flex items-center gap-4 pl-4 border-l border-slate-200 ml-2 group cursor-pointer">

                <div class="hidden text-right lg:block">
                    <span class="block text-sm font-bold text-slate-700">
                        {{ currentUser?.username || 'Administrator' }}
                    </span>
                    <span class="block text-xs font-medium text-slate-400">
                        {{ currentUser?.role || 'System Admin' }}
                    </span>
                </div>

                <div class="h-10 w-10 rounded-full bg-slate-200 overflow-hidden border-2 border-white shadow-sm">
                    <img src="assets/default-user.png" class="h-full w-full object-cover" alt="User" />
                </div>

                <i
                    class="fa-solid fa-chevron-down text-xs text-slate-400 transition-transform group-hover:rotate-180"></i>

                <div
                    class="absolute right-0 top-full mt-4 w-48 bg-white rounded-xl shadow-xl border border-slate-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 transform translate-y-2 group-hover:translate-y-0 z-50">
                    <ul class="flex flex-col py-2">
                        <li>
                            <a href="#"
                                class="flex items-center gap-3 px-6 py-2 text-sm text-slate-600 hover:text-[#FF7F11] hover:bg-slate-50">
                                <i class="fa-regular fa-user"></i> My Profile
                            </a>
                        </li>
                        <li>
                            <a href="#"
                                class="flex items-center gap-3 px-6 py-2 text-sm text-slate-600 hover:text-[#FF7F11] hover:bg-slate-50">
                                <i class="fa-solid fa-gear"></i> Settings
                            </a>
                        </li>
                        <li class="border-t border-slate-100 mt-2 pt-2">
                            <button (click)="onLogout()"
                                class="w-full flex items-center gap-3 px-6 py-2 text-sm text-red-500 hover:bg-red-50 text-left">
                                <i class="fa-solid fa-right-from-bracket"></i> Logout
                            </button>
                        </li>
                    </ul>
                </div>

            </div>

        </div>

    </div>
</header>
