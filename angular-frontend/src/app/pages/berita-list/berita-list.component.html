<app-navbar></app-navbar>

<!-- Breadcrumb -->
<section class="bg-[#051D47] pt-24 pb-8 px-4 md:px-8">
    <div class="container mx-auto max-w-7xl">
        <nav class="text-sm text-white/70">
            <a routerLink="/" class="hover:text-white transition-colors">Beranda</a>
            <span class="mx-2">/</span>
            <span class="text-[#FF7F11]">Berita</span>
        </nav>
    </div>
</section>

<!-- News Grid Section -->
<section class="bg-[#051D47] pb-16 md:pb-24">
    <div class="container mx-auto px-4 md:px-8 lg:px-16 max-w-7xl">

        <!-- Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <a *ngFor="let news of newsList" [routerLink]="['/berita', news.id]"
                class="group bg-[#0A2656] rounded-2xl overflow-hidden shadow-lg hover:shadow-2xl transition-all duration-500 border border-white/5">

                <!-- Image -->
                <div class="relative h-48 overflow-hidden">
                    <img [src]="news.image" [alt]="news.title"
                        class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#051D47] to-transparent opacity-50"></div>
                </div>

                <!-- Content -->
                <div class="p-5">
                    <span class="inline-block px-3 py-1 bg-[#FF7F11] text-white text-xs font-bold rounded-full mb-3">
                        {{ news.category }}
                    </span>
                    <h3 class="text-white font-bold mb-2 line-clamp-2 group-hover:text-[#FF7F11] transition-colors">
                        {{ news.title }}
                    </h3>
                    <p class="text-white/60 text-sm line-clamp-2">{{ news.excerpt }}</p>
                </div>
            </a>
        </div>

        <!-- Pagination -->
        <div class="flex justify-center items-center gap-2 mt-12">
            <button *ngFor="let page of pages" (click)="goToPage(page)"
                [ngClass]="{'bg-[#FF7F11] text-white': currentPage === page, 'bg-white text-[#051D47]': currentPage !== page}"
                class="w-10 h-10 rounded-lg font-bold text-sm hover:bg-[#FF7F11] hover:text-white transition-all">
                {{ page }}
            </button>
        </div>

    </div>
</section>

<app-footer></app-footer>
